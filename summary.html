<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summary · ResumeAI</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="summary">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <div class="user-chip"><span class="avatar" id="userAvatar">R</span><span id="userName">Recruiter</span></div>
      </header>

      <main class="content">
        <div id="summaryContent">
          <h1 class="page-title">Screening Summary</h1>
          <p class="page-subtitle">Results for the most recent screening.</p>

          <div id="summaryMessage" class="hidden"></div>

          <div class="stats">
            <div class="card stat"><span class="card-icon"><i data-icon="users"></i></span><div><div class="stat-label">Total Candidates</div><div class="stat-value" id="statTotal">—</div></div></div>
            <div class="card stat"><span class="card-icon"><i data-icon="check"></i></span><div><div class="stat-label">Strong Matches</div><div class="stat-value" id="statStrong">—</div></div></div>
            <div class="card stat"><span class="card-icon"><i data-icon="trend"></i></span><div><div class="stat-label">Average Match</div><div class="stat-value" id="statAverage">—</div></div></div>
            <div class="card stat"><span class="card-icon"><i data-icon="star"></i></span><div><div class="stat-label">Top Match</div><div class="stat-value" id="statTop">—</div></div></div>
          </div>

          <section class="card">
            <h2 class="card-title" style="margin-bottom:10px">Candidate Results</h2>
            <ul class="result-list" id="resultList">
              <li class="empty-state">Results will appear here once the backend returns them.</li>
            </ul>
          </section>

          <p style="margin-top:20px"><a href="index.html" class="btn btn-primary btn-lg"><i data-icon="refresh"></i> Start New Screening</a></p>
        </div>

        <section class="card hidden" id="noScreening">
          <div class="empty-state">
            <p>No screening results yet.</p>
            <p style="margin-top:14px"><a href="index.html" class="btn btn-primary">Start New Screening</a></p>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
