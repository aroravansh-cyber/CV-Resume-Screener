<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · ResumeAI</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="dashboard">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <div class="user-chip"><span class="avatar" id="userAvatar">R</span><span id="userName">Recruiter</span></div>
      </header>

      <main class="content" id="new">
        <h1 class="page-title">Start New Screening</h1>
        <p class="page-subtitle">Paste a job description, upload candidate CVs, and start screening.</p>

        <div id="formMessage" class="hidden"></div>

        <div class="stack">
          <!-- Job description: TEXT ONLY -->
          <section class="card">
            <div class="card-head">
              <span class="card-icon"><i data-icon="briefcase"></i></span>
              <div>
                <h2 class="card-title">Job Description</h2>
                <p class="card-desc" style="margin:0">Paste the full job description as text.</p>
              </div>
            </div>
            <textarea id="jobDescription" placeholder="Paste job description here..." aria-label="Job description"></textarea>
            <div class="textarea-meta">
              <span><span id="charCount">0</span> characters</span>
              <button type="button" class="btn btn-text" id="clearJd">Clear</button>
            </div>
          </section>

          <!-- CV upload -->
          <section class="card">
            <div class="card-head">
              <span class="card-icon"><i data-icon="users"></i></span>
              <div>
                <h2 class="card-title">Upload Candidate CVs</h2>
                <p class="card-desc" style="margin:0">You can select multiple files at once.</p>
              </div>
            </div>

            <div class="dropzone" id="dropzone">
              <i data-icon="upload"></i>
              <p>Drag and drop CV files here</p>
              <p class="hint" id="formatHint">PDF, DOC, DOCX, JPG, JPEG, PNG</p>
              <button type="button" class="btn" id="browseBtn">Browse Files</button>
              <input type="file" id="fileInput" multiple class="hidden" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
            </div>

            <div class="file-count" id="fileCount"></div>
            <ul class="file-list" id="fileList"></ul>
          </section>

          <button type="button" class="btn btn-primary btn-lg" id="startBtn"><i data-icon="play"></i> Start Screening</button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
